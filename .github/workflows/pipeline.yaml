name: Project Pipeline

on:
  push:
    branches:
      - 'main'
      - 'feature**'

env:

  COGNITO_DOMAIN: tabletop-beholder

  GH_PACKAGE_REG_READ_USER: ${{ secrets.GH_PACKAGE_REG_READ_USER }}
  GH_PACKAGE_REG_READ_PASS: ${{ secrets.GH_PACKAGE_REG_READ_PASS }}
  
  SAM_TEMPLATE: template.yaml

  STACK_NAME: project-tabletop-beholder
  PIPELINE_EXECUTION_ROLE: ${{ vars.AWS_PIPELINE_EXECUTION_ROLE }}
  CLOUDFORMATION_EXECUTION_ROLE: ${{ vars.AWS_CLOUDFORMATION_EXECUTION_ROLE }}
  ARTIFACTS_BUCKET: aws-sam-cli-managed-prod-pipeline--artifactsbucket-hoeaoa8f7op8
  WEBSITE_BUCKET: tabletop-beholder
  REGION: us-east-2

jobs:

  build-feature:
    # this stage is triggered only for feature branches (feature*),
    # which will build the stack and deploy to a stack named with branch name.
    if: startsWith(github.ref, 'refs/heads/feature')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
      - uses: aws-actions/setup-sam@v1
      - run: sam build --template ${SAM_TEMPLATE}

  build-and-package-main:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
      - uses: actions/setup-node@v3
      - uses: aws-actions/setup-sam@v1

      - name: Build SAM resources
        run: |
          sam build --template ${SAM_TEMPLATE}

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.REGION }}
          role-to-assume: ${{ env.PIPELINE_EXECUTION_ROLE }}
          role-session-name: beholder-package
          allowed-account-ids: '010438496967'

      - name: Upload SAM artifacts to artifact buckets
        run: |
          sam package \
            --s3-bucket ${ARTIFACTS_BUCKET} \
            --region ${REGION} \
            --output-template-file packaged-prod.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: packaged-prod.yaml
          path: packaged-prod.yaml

      - name: Install NPM dependencies
        working-directory: web
        run: npm install

      - name: Create .env file for npm build
        working-directory: web
        run: |
          outputs=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$REGION" --query 'Stacks[0].Outputs' --output json)
          jq -er '
            map({key: .OutputKey, value: .OutputValue}) | from_entries |
            "API_BASE_URL=\(.ApiBaseUrl | strings)",
            "COGNITO_DOMAIN=\(.CognitoDomain | strings)",
            "COGNITO_USER_POOL_ID=\(.CognitoUserPoolId | strings)",
            "COGNITO_USER_POOL_CLIENT_ID=\(.CognitoUserPoolClientId | strings)",
            "COGNITO_REDIRECT_SIGNIN=\(.CognitoRedirectSignin | strings)",
            "COGNITO_REDIRECT_SIGNOUT=\(.CognitoRedirectSignout | strings)"
          ' <<< "$outputs" > .env
          test "$(wc -l < .env)" -eq 6

      - name: Build NPM static resources
        working-directory: web
        run: npm run build

      - name: Upload NPM static build output
        uses: actions/upload-artifact@v4
        with:
          name: static-build
          path: web/build

  deploy-to-aws:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    needs: [build-and-package-main]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
      - uses: actions/setup-node@v3
      - uses: aws-actions/setup-sam@v1
      - uses: actions/download-artifact@v4
        with:
          name: packaged-prod.yaml

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.REGION }}
          role-to-assume: ${{ env.PIPELINE_EXECUTION_ROLE }}
          role-session-name: beholder-deploy
          allowed-account-ids: '010438496967'

      - name: Deploy to the Beholder stack
        run: |
          sam deploy --stack-name ${STACK_NAME} \
            --template packaged-prod.yaml \
            --capabilities CAPABILITY_IAM \
            --region ${REGION} \
            --s3-bucket ${ARTIFACTS_BUCKET} \
            --no-fail-on-empty-changeset \
            --parameter-overrides "S3Bucket=${WEBSITE_BUCKET} CognitoDomain=${COGNITO_DOMAIN}" \
            --role-arn ${CLOUDFORMATION_EXECUTION_ROLE}

      - name: Download NPM static resources
        uses: actions/download-artifact@v4
        with:
          name: static-build
          path: build/static

      - name: Deploy NPM static resources
        run: |
          aws s3 cp \
            build/static \
            s3://${WEBSITE_BUCKET}/static/ \
            --recursive
